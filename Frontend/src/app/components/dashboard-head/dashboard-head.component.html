<div class="topbar">
  <p-menubar [model]="menuItems">
    <ng-template pTemplate="start">
      <div class="topbar">
        <div class="d-flex">
          <app-sidebar *ngIf="!isCustomerSupport"></app-sidebar>
          <div class="user-info">
            <img
              src="../../../assets/images/profile.jpg"
              alt="User Logo"
              class="user-logo"
            />
            <div>
              <h6 class="m-0">User: {{ currentUserDetail.username }}</h6>
              <h6 class="m-0" *ngIf="currentUserDetail?.authorities.length > 0">
                Role: {{ currentUserDetail?.authorities[0].authority }}
              </h6>
            </div>
          </div>
        </div>
      </div>
    </ng-template>

    <ng-template pTemplate="end">
      <div class="topbar-right">
        <button class="btn btn-dark" (click)="logout()">
          Logout <i class="pi pi-power-off"></i>
        </button>
      </div>
    </ng-template>
  </p-menubar>
</div>
