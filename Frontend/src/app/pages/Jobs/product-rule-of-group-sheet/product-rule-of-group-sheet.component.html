<form class="was-validated" #myForm="ngForm" novalidate (ngSubmit)="submit()">
  <p-toast></p-toast>
  <app-dashboard-head></app-dashboard-head>
  <div class="card flex justify-content-center">
    <p-accordion [multiple]="true" [activeIndex]="[0]">
      <p-accordionTab header="Details:">
        <div class="container-fluid my-3">
          <div class="card py-3">
            <div class="row mx-3">
              <div class="col-3">
                <label class="add-order-label m-0">Category</label>
                <p-dropdown
                  styleClass="w-100"
                  [options]="categoryList"
                  [(ngModel)]="productRule.businessCategory"
                  [required]="true"
                  optionLabel="name"
                  optionValue="name"
                  name="category"
                ></p-dropdown>
              </div>
              <div class="col-3">
                <label class="add-order-label m-0">Group Sheet</label>
                <p-dropdown
                  styleClass="w-100"
                  [options]="productRuleList"
                  [(ngModel)]="selectedProductRule"
                  [required]="true"
                  (ngModelChange)="onProductRuleChange($event)"
                  optionLabel="productName"
                  name="category"
                ></p-dropdown>
              </div>
              <div class="col-1">
                <label class="add-order-label m-0">Up</label>
                <p-inputNumber
                  [(ngModel)]="productRule.up"
                  mode="decimal"
                  inputId="withoutgrouping"
                  name="up"
                  [useGrouping]="false"
                />
              </div>
              <div class="col-4">
                <label class="add-order-label m-0">Visible to</label>
                <p-multiSelect
                  styleClass="w-100"
                  class="customSize"
                  [options]="roleList"
                  [(ngModel)]="productRule.visibleTo"
                  [required]="true"
                  optionLabel="name"
                  display="chip"
                  name="roles"
                ></p-multiSelect>
              </div>
              <div class="col-1">
                <label class="add-order-label m-0">Active</label>
                <div class="form-check form-switch form-switch-lg">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="flexSwitchCheckChecked"
                    name="impositionValueChecked"
                    [(ngModel)]="selectedStatus"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </p-accordionTab>
    </p-accordion>
  </div>
  <div class="container-fluid mt-3">
    <div class="row justify-content-end">
      <div class="col-1">
        <button class="btn btn-dark w-100" type="submit">Save</button>
      </div>
    </div>
  </div>
</form>
