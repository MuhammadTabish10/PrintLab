<div class="body-position ps-4 ps-lg-0">
  <div class="main-container ms-lg-1 ms-3">
    <p-toast></p-toast>
    <div class="text-center text-lg-start">
      <h4>Job process</h4>
      <p class="page-intro">Whole data about your business here</p>
    </div>
    <div class="order-body">
      <div *ngIf="jobProcessedActive">
        <div
          class="container-fluid card p-3"
          *ngIf="productRuleJob?.processList"
        >
          <p-accordion [multiple]="true" [activeIndex]="openTabIndex">
            <p-accordionTab
              *ngFor="
                let category of productRuleJob?.processList;
                let i = index
              "
              [selected]="i === openTabIndex"
              (onOpen)="openTabIndex = i"
            >
              <ng-template pTemplate="header">
                <span
                  class="font-bold white-space-nowrap text-nowrap"
                  [ngClass]="{
                    'p-accordion p-accordion-header:not(p-disabled)p-highlight p-accordion-header-link':
                      i === openTabIndex
                  }"
                >
                  {{ category.process }}
                </span>
              </ng-template>
              <div class="card px-1" *ngIf="productRuleJob">
                <div class="row my-3">
                  <div class="col-6">
                    <label class="d-block add-order-label m-0 fw-bolder"
                      >Amount</label
                    >
                    <p-inputNumber
                      [min]="0"
                      [format]="true"
                      mode="currency"
                      currency="PKR"
                      [disabled]="disabledTabs[i]"
                      [style]="{ width: '10%' }"
                      [name]="'amount[' + i + ']'"
                      [required]="true"
                      [(ngModel)]="productRuleJob.processedDetailList[i].amount"
                    ></p-inputNumber>
                  </div>
                </div>

                <div class="row my-3">
                  <div class="col-lg-2 col-md-4 col-12">
                    <label class="d-block add-order-label m-0 fw-bolder"
                      >Vendor</label
                    >
                    <p-dropdown
                      [options]="category.vendors"
                      styleClass="w-100"
                      optionLabel="name"
                      optionValue="name"
                      [disabled]="disabledTabs[i]"
                      [(ngModel)]="productRuleJob.processedDetailList[i].vendor"
                      [filter]="true"
                      filterBy="name"
                      [name]="'vendor[' + i + ']'"
                    ></p-dropdown>
                  </div>
                </div>
                <div class="row my-3">
                  <div class="col-lg-2 col-md-4 col-12">
                    <label class="d-block add-order-label m-0 fw-bolder"
                      >Payment</label
                    >
                    <p-dropdown
                      [options]="paymentMethods"
                      styleClass="w-100"
                      [disabled]="disabledTabs[i]"
                      optionValue="name"
                      [(ngModel)]="
                        productRuleJob.processedDetailList[i].payment
                      "
                      optionLabel="name"
                      [filter]="true"
                      filterBy="name"
                      [name]="'payment[' + i + ']'"
                    ></p-dropdown>
                  </div>
                </div>
                <div class="row my-3">
                  <div class="col-lg-2 col-md-4 col-12">
                    <label class="d-block add-order-label m-0 fw-bolder"
                      >Update</label
                    >
                    <div class="form-check form-switch form-switch-lg pointer">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        [id]="'flexSwitchCheckChecked[' + i + ']'"
                        [disabled]="disabledTabs[i]"
                        [name]="'impositionValueChecked[' + i + ']'"
                        (change)="submit(category, i, $event.target!)"
                        (change)="onCheckboxChange($event)"
                        [(ngModel)]="
                          productRuleJob.processedDetailList[i].jobProcessed
                        "
                      />
                    </div>
                  </div>
                </div>
              </div>
              <!-- <div class="text-center mt-3">
              <button
                class="btn btn-primary"
                (click)="onNextTabClick(productRuleJob?.processedDetailList)"
              >
                Next
              </button>
            </div> -->
            </p-accordionTab>
          </p-accordion>
        </div>
      </div>
    </div>
  </div>
</div>
