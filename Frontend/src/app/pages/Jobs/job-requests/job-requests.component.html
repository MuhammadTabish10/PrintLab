<app-sidebar></app-sidebar>
<div class="body-position ps-4 ps-lg-0">
  <app-dashboard-head></app-dashboard-head>
  <div class="main-container ms-lg-1 ms-3">
    <div class="text-center text-lg-start">
      <h4>Job process</h4>
      <p class="page-intro">Whole data about your business here</p>
    </div>
    <div class="card">
      <p-toast></p-toast>
      <p-steps
        [model]="items"
        [readonly]="false"
        [activeIndex]="activeIndex"
        (activeIndexChange)="onActiveIndexChange($event)"
      >
      </p-steps>
    </div>
    <div class="order-body">
      <div *ngIf="overviewActive">
        <div class="card p-5">
          <p-timeline [value]="events">
            <ng-template pTemplate="content" let-event>
              <small class="p-text-secondary">{{ event.date }}</small>
            </ng-template>
            <ng-template pTemplate="opposite" let-event>
              {{ event.status }}
            </ng-template>
          </p-timeline>
        </div>
      </div>
      <div *ngIf="jobProcessedActive">
        <div class="container-fluid card p-3">
          <p-accordion [multiple]="true" [activeIndex]="openTabIndex">
            <p-accordionTab
              *ngFor="let category of jobById?.processList; let i = index"
              [selected]="i === openTabIndex"
              (onOpen)="openTabIndex = i"
            >
              <ng-template pTemplate="header">
                <span
                  class="font-bold white-space-nowrap text-nowrap"
                  [ngClass]="{
                    'p-accordion p-accordion-header:not(p-disabled)p-highlight p-accordion-header-link':
                      i === openTabIndex
                  }"
                >
                  {{ category.process }}
                </span>
              </ng-template>
              <div class="card px-1" *ngIf="jobById">
                <div class="row my-3">
                  <div class="col-6">
                    <label class="d-block add-order-label m-0 fw-bolder"
                      >Amount</label
                    >
                    <p-inputNumber
                      [min]="0"
                      [format]="true"
                      mode="currency"
                      currency="PKR"
                      [disabled]="disabledTabs[i]"
                      [style]="{ width: '10%' }"
                      [name]="'amount[' + i + ']'"
                      [required]="true"
                      [(ngModel)]="jobById.processedDetailList[i].amount"
                    ></p-inputNumber>
                  </div>
                </div>

                <div class="row my-3">
                  <div class="col-lg-2 col-md-4 col-12">
                    <label class="d-block add-order-label m-0 fw-bolder"
                      >Vendor</label
                    >
                    <p-dropdown
                      [options]="category.vendors"
                      styleClass="w-100"
                      optionLabel="name"
                      optionValue="name"
                      [disabled]="disabledTabs[i]"
                      [(ngModel)]="jobById.processedDetailList[i].vendor"
                      [filter]="true"
                      filterBy="name"
                      [name]="'vendor[' + i + ']'"
                    ></p-dropdown>
                  </div>
                </div>
                <div class="row my-3">
                  <div class="col-lg-2 col-md-4 col-12">
                    <label class="d-block add-order-label m-0 fw-bolder"
                      >Payment</label
                    >
                    <p-dropdown
                      [options]="paymentMethods"
                      styleClass="w-100"
                      [disabled]="disabledTabs[i]"
                      optionValue="name"
                      [(ngModel)]="jobById.processedDetailList[i].payment"
                      optionLabel="name"
                      [filter]="true"
                      filterBy="name"
                      [name]="'payment[' + i + ']'"
                    ></p-dropdown>
                  </div>
                </div>
                <div class="row my-3">
                  <div class="col-lg-2 col-md-4 col-12">
                    <label class="d-block add-order-label m-0 fw-bolder"
                      >Update</label
                    >
                    <div class="form-check form-switch form-switch-lg pointer">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="flexSwitchCheckChecked"
                        [disabled]="disabledTabs[i]"
                        name="impositionValueChecked"
                        (change)="submit(category, i, $event.target!)"
                        [(ngModel)]="
                          jobById.processedDetailList[i].jobProcessed
                        "
                      />
                    </div>
                  </div>
                </div>
              </div>
              <!-- <div class="text-center mt-3">
              <button
                class="btn btn-primary"
                (click)="onNextTabClick(jobById?.processedDetailList)"
              >
                Next
              </button>
            </div> -->
            </p-accordionTab>
          </p-accordion>
        </div>
      </div>
    </div>
  </div>
</div>
