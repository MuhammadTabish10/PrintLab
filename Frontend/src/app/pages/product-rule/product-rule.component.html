<div class="container-fluid px-0">
  <app-dashboard-head></app-dashboard-head>
  <div class="ps-0">
    <p-toast></p-toast>
    <div>
      <h4>Products</h4>
      <p class="page-intro">Whole data about your business here</p>
    </div>
    <div class="container-fluid px-0 mt-5">
      <div class="order-search-panel">
        <input
          type="text"
          placeholder="Search by Product Size"
          [(ngModel)]="search"
          class="order-search form-control"
          (keyup)="searchProductRule($event.target)"
        />
        <div>
          <p-panelMenu [model]="items" class="custom" />
        </div>
      </div>
      <div class="order-table overflow-auto pt-0">
        <table class="table table-responsive text-center">
          <thead>
            <tr>
              <th scope="col" class="col">ID</th>
              <th scope="col" class="col">CATEGORY</th>
              <th scope="col" class="col">PRODUCT</th>
              <th scope="col" class="col">TYPE</th>
              <th scope="col" class="col">ACTIONS</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="!tableData">
              <td colspan="7" class="text-center">No record found</td>
            </tr>
            <tr *ngFor="let product of tableData; let i = index">
              <td>{{ product.id }}</td>
              <td>
                <ng-container
                  *ngIf="product.type === 'auto'; else manualCategory"
                >
                  Offset
                </ng-container>
                <ng-template #manualCategory>
                  {{ product.category }}
                </ng-template>
              </td>

              <td>{{ product.title }}</td>
              <td>{{ product.type }}</td>
              <td>
                <div class="btn-group" role="group">
                  <button
                    type="button"
                    class="btn order-table-btn"
                    (click)="editProduct(product.id, product.type)"
                  >
                    <i class="fa-solid fa-pen pe-lg-2"></i><small>Edit</small>
                  </button>
                  <button
                    type="button"
                    class="btn order-table-btn"
                    (click)="viewProduct(product.id)"
                  >
                    <i class="fa-solid fa-hand-pointer pe-lg-2"></i>&nbsp;<small
                      >View</small
                    >
                  </button>
                  <button
                    type="button"
                    class="btn order-table-btn"
                    (click)="deleteProduct(product.id, product.type)"
                  >
                    <i class="fa-solid fa-trash pe-lg-2"></i
                    ><small class="">Delete</small>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
