<div class="body-position">
  <app-dashboard-head></app-dashboard-head>
  <div class="main-container">
    <div>
      <h3>Vendor</h3>
    </div>
    <div class="card text-nowrap">
      <p-table
        #dt1
        [value]="vendorArray"
        dataKey="id"
        [globalFilterFields]="['name']"
      >
        <ng-template pTemplate="caption">
          <div class="d-flex flex-wrap justify-content-between align-items-center">
            <span class="p-input-icon-right mb-2">
              <i class="pi pi-search"></i>
              <input
                pInputText
                type="text"
                (input)="searchVendor($event.target)"
                placeholder="Search Vendor"
              />
            </span>
            <button
              pButton
              label="Add"
              class="p-button-dark bg-dark mb-2"
              icon="pi pi-plus"
              routerLink="/addVendor"
            ></button>
          </div>
        </ng-template>
        <ng-template pTemplate="header">
          <tr>
            <th class="text-center">Date Added</th>
            <th class="text-center">Business Name</th>
            <th class="text-center">Point of Contact</th>
            <th class="text-center">Phone</th>
            <th class="text-center">Email</th>
            <th class="text-center">Address</th>
            <th class="text-center">Process</th>
            <th class="text-center">Notes</th>
            <th class="text-center">Action</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-vendor let-i="rowIndex">
          <tr>
            <td class="text-center">
              {{ vendor?.date }}
            </td>
            <td class="text-center">
              {{ vendor?.name }}
            </td>
            <td class="text-center">
              {{ vendor?.contactName }}
            </td>
            <td class="text-center">
              {{ vendor?.contactNumber }}
            </td>
            <td class="text-center">
              {{ vendor?.email }}
            </td>
            <td class="text-center">
              {{ vendor?.address }}
            </td>
            <td class="text-center">
              {{ process[i] }}
            </td>
            <td class="text-center">
              {{ vendor?.notes }}
            </td>
            <td class="text-center">
              <div
                class="btn-group"
                role="group"
                aria-label="Action buttons"
              >
                <button
                  type="button"
                  class="btn order-table-btn"
                  (click)="editVendor(vendor?.id)"
                >
                  <i class="fa-solid fa-pen"></i>&nbsp;Edit
                </button>
                <button
                  type="button"
                  class="btn order-table-btn"
                  (click)="deleteVendor(vendor?.id)"
                >
                  <i class="fa-solid fa-trash"></i>&nbsp;Delete
                </button>
                <button
                  type="button"
                  class="btn order-table-btn"
                  (click)="vendorSettlement(vendor?.id)"
                >
                  <i class="fa-solid fa-wallet"></i>&nbsp;Settlement
                </button>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="9" class="text-center">No Vendor Found.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
<p-toast></p-toast>
