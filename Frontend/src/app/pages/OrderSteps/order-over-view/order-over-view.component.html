<div class="card flex justify-content-center">
  <p-accordion [multiple]="true" [activeIndex]="[0]">
    <p-accordionTab header="Details">
      <div class="container-fluid">
        <div class="row">
          <div class="col-2">
            <h3>Category</h3>
            <h6>Offset printing</h6>
          </div>
          <div class="col-2">
            <h3>Product</h3>
            <h6>{{ orderById.paper }}</h6>
          </div>
          <div class="col-2">
            <h3>Size</h3>
            <h6>
              {{ parsedSize?.inch + " in" }}
            </h6>
          </div>
          <div class="col-2">
            <h3>Quantity</h3>
            <h6>{{ orderById.quantity }}</h6>
          </div>
          <div class="col-2">
            <h3>Unit</h3>
            <h6>{{ "Pkr " + orderById.price / orderById.quantity }}</h6>
          </div>
          <div class="col-2">
            <h3>Amount</h3>
            <h6>{{ orderById.price }}</h6>
          </div>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>
